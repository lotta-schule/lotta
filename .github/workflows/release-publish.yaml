# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
# When a release pull request (release/vX.Y.Z, opened by release-create.yaml)
# is merged: tag the merge commit vX.Y.Z and create the GitHub release.
# The tag push starts cd.yaml, which builds and publishes the X.Y.Z images.
name: 'Release: Publish version'
on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 'Tag and publish release'
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      # Tags pushed with the default GITHUB_TOKEN do not trigger other workflows
      # (cd.yaml would not build the release images), so use the release GitHub App.
      - uses: actions/create-github-app-token@v1
        name: Create GitHub App Token
        id: app-token
        with:
          app-id: ${{ vars.GH_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_RELEASE_APP_PRIVKEY }}

      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version
        id: version
        run: |
          VERSION="${BRANCH#release/v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch $BRANCH does not name a version (release/vX.Y.Z)"
            exit 1
          fi
          PACKAGE_VERSION=$(jq -r .version apps/webapp/package.json)
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::apps/webapp/package.json has version $PACKAGE_VERSION, expected $VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Git User
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Tag merge commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "v$VERSION" "$MERGE_SHA" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
          echo "Released [v$VERSION]($(gh release view "v$VERSION" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git push origin --delete "$BRANCH" || echo "Branch $BRANCH is already deleted"
