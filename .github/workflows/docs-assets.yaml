# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
# Regenerates the screenshots and videos of the documentation (apps/docs) with
# the Playwright `docs` projects (apps/e2e/docs).
# - called by release-create.yaml: uploads them as the `docs-assets` artifact,
#   which is committed to the release PR
# - run manually: opens a pull request when they changed
name: Docs assets
on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag of the lotta web and core images to capture
        type: string
        required: true
      open_pr:
        description: Open a pull request with the changed assets
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag of the lotta web and core images (default the commit SHA of the selected ref, which CD builds for every push)
        type: string
        required: false
      open_pr:
        description: Open a pull request with the changed assets
        type: boolean
        required: false
        default: true

concurrency:
  group: docs-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture docs assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CD builds the images for the same push: wait until they are published
      - name: Wait for the docker images
        run: |
          for image in web core; do
            for attempt in $(seq 1 120); do
              if docker manifest inspect "ghcr.io/lotta-schule/$image:$IMAGE_TAG" > /dev/null 2>&1; then
                echo "ghcr.io/lotta-schule/$image:$IMAGE_TAG is available"
                continue 2
              fi
              echo "Waiting for ghcr.io/lotta-schule/$image:$IMAGE_TAG ($attempt/120)"
              sleep 30
            done
            echo "::error::Image ghcr.io/lotta-schule/$image:$IMAGE_TAG was not published in time"
            exit 1
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.2

      - name: Install node dependencies
        run: bun install
        working-directory: apps/e2e

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # the docs projects run in chromium only
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/e2e

      - name: Run lotta as a service from docker-compose.yml
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          cwd: ${{ github.workspace }}/apps/e2e
          compose-file: docker-compose.yaml
          compose-flags: --verbose
          up-flags: --force-recreate --wait

      - name: Capture screenshots and videos
        run: bun run docs:capture
        working-directory: apps/e2e

      # Recorded videos are never byte-identical between runs: only update them
      # together with screenshots (= when the UI changed). New videos are kept.
      - name: Keep unchanged videos
        run: |
          if git diff --quiet -- apps/docs/src/assets/screenshots \
            && [ -z "$(git ls-files --others --exclude-standard -- apps/docs/src/assets/screenshots)" ]; then
            git checkout -- apps/docs/src/assets/videos 2> /dev/null || true
          fi
          git status --short -- apps/docs/src/assets

      - name: Upload docs assets
        uses: actions/upload-artifact@v4
        with:
          name: docs-assets
          path: |
            apps/docs/src/assets/screenshots
            apps/docs/src/assets/videos
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: docs-assets-test-results
          path: apps/e2e/test-results
          retention-days: 7

      - name: Open pull request with the changed assets
        if: ${{ inputs.open_pr }}
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: chore/docs-assets
          delete-branch: true
          add-paths: |
            apps/docs/src/assets/screenshots/**
            apps/docs/src/assets/videos/**
          commit-message: 'docs: update screenshots and videos (${{ github.ref_name }})'
          title: 'docs: update screenshots and videos (${{ github.ref_name }})'
          body: |
            Screenshots and videos of the documentation, captured by the Playwright `docs` projects
            (`apps/e2e/docs`) against the images `${{ env.IMAGE_TAG }}`.

            Generated by the [Docs assets workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: documentation
